[project]
name = "bv-workstation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "charset-normalizer>=3.4,<4",
  "EbookLib>=0.19,<1",
  "PyMuPDF>=1.26,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "editables~=0.3",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
bv = "bv.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/bv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
